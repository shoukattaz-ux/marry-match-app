# Keeps the free Supabase project from pausing: free projects pause after 7 days without
# activity. Every 3 days this calls the tiny public "ping" function (migration 018), which reads
# nothing private. Scheduled runs only happen from the default branch (main). GitHub turns
# schedules off after 60 days without commits; it emails the owner, who can re-enable it.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/keep-alive.yml

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          # Public values: the same URL and publishable key are inside the app.
          SUPABASE_URL: https://zaixmvhfblgarpjckjhc.supabase.co
          SUPABASE_KEY: sb_publishable_BPKKyNeKBkM4TISXxyXi4w_Y26xeoVi
        run: |
          for attempt in 1 2 3; do
            body=$(curl -sS --max-time 30 -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
              -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}') && \
            echo "Answer: $body" && [ "$body" = '"ok"' ] && exit 0
            echo "Attempt $attempt failed, retrying"; sleep 20
          done
          echo "::error::Supabase did not answer. If the project is paused, restore it in the dashboard."
          exit 1
