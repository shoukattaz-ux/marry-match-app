# Builds the signed Android App Bundle (.aab) for Google Play. Run it by hand:
# Actions → "Android release" → Run workflow. Needs three repository secrets
# (Settings → Secrets and variables → Actions):
#   UPLOAD_KEYSTORE_BASE64  the upload keystore file, base64-encoded
#   STORE_PASSWORD          its password
#   KEY_PASSWORD            the password of the key "upload" inside it
name: Android release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown in the store, e.g. 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Check signing secrets
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          SP: ${{ secrets.STORE_PASSWORD }}
          KP: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$SP" ] || [ -z "$KP" ]; then
            echo "::error::Add UPLOAD_KEYSTORE_BASE64, STORE_PASSWORD and KEY_PASSWORD as repository secrets first."
            exit 1
          fi

      - name: Write upload keystore
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Unit tests
        run: gradle --no-daemon testReleaseUnitTest

      - name: Build signed bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: gradle --no-daemon --stacktrace bundleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: marrymatch-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
