# Builds the app and runs the unit tests on every push and pull request, and offers the
# debug APK for download (Actions run → Artifacts → marrymatch-debug-apk). After a push the
# APK is also on the Releases page as "Latest test build", a direct link that works on a phone:
# https://github.com/shoukattaz-ux/marry-match-app/releases/download/latest-debug/MarryMatch-debug.apk
name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # write: only to replace the "Latest test build" release below (never on pull requests).
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The repo has no gradlew script, so install the Gradle version from gradle-wrapper.properties.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # Debug builds are signed with debug.keystore (not in git). Keep one in the Actions cache so
      # every APK has the same signature and installs over the previous one.
      - name: Restore debug keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: debug-keystore-v1

      - name: Create debug keystore
        if: steps.keystore.outputs.cache-hit != 'true'
        run: >
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey
          -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # Supabase URL and the publishable key come from .env.example (public values; the server
      # protects the data with Row Level Security). No secrets are needed for this build.
      - name: Unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marrymatch-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # One release, replaced by every successful push, so the download link never changes.
      - name: Publish APK as "Latest test build"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk MarryMatch-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug MarryMatch-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest test build" \
            --notes "Debug APK from branch ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}. On the phone: tap MarryMatch-debug.apk below, then open the download to install."

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
